<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Peripheral Initiative</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

  :root {
    --void: #070a08;
    --matrix: #2fe374;
    --decay: #123821;
    --resolved: #d7e4da;
    --muted: #5c6b60;
    --flash: #b6ffd8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }

  #rain-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0;
    transition: opacity 2.5s ease-in;
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10vh 10vw;
  }

  #terminal {
    max-width: 720px;
    font-size: clamp(1rem, 2.4vw, 1.5rem);
    line-height: 1.8;
    letter-spacing: 0.02em;
    color: var(--matrix);
    text-align: left;
    text-shadow: 0 0 12px rgba(47, 227, 116, 0.35);
  }

  .terminal-line {
    margin-bottom: 1.1em;
  }

  .prompt-arrow {
    color: var(--matrix);
  }

  #yesno-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--matrix);
    font-family: 'JetBrains Mono', monospace;
    font-size: inherit;
    letter-spacing: 0.02em;
    caret-color: var(--matrix);
    width: 160px;
    text-shadow: 0 0 12px rgba(47, 227, 116, 0.35);
  }

  .cursor-inline {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--matrix);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 0.9s step-end infinite;
    box-shadow: 0 0 8px rgba(47, 227, 116, 0.8);
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(
      180deg,
      rgba(0, 0, 0, 0.18) 0px,
      rgba(0, 0, 0, 0.18) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: 0.4;
    animation: flicker 6s infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 0.4; }
    97% { opacity: 0.25; }
    98% { opacity: 0.5; }
  }

  #passcode-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.8s ease;
  }

  #passcode-layer.active {
    opacity: 1;
    pointer-events: all;
  }

  .prompt-label {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  .question {
    color: var(--resolved);
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    max-width: 480px;
    text-align: center;
    line-height: 1.6;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--decay);
    padding-bottom: 10px;
  }

  #passcode-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--matrix);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    text-align: center;
    width: 260px;
    caret-color: var(--matrix);
  }

  #passcode-input::placeholder {
    color: var(--decay);
  }

  .cursor {
    width: 9px;
    height: 18px;
    background: var(--matrix);
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  #feedback {
    height: 20px;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  #feedback.wrong {
    color: #ff5c5c;
    animation: shake 0.4s;
  }

  #feedback.correct {
    color: var(--flash);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #skip-hint {
    position: fixed;
    bottom: 24px;
    right: 28px;
    z-index: 4;
    color: var(--decay);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="rain-canvas"></canvas>
<div class="scanlines"></div>

<div id="stage">
  <div id="terminal"></div>
</div>

<div id="passcode-layer">
  <div class="prompt-label">Access Requires Verification</div>
  <div class="question">In what year was Periphery's self-titled debut album released?</div>
  <div class="input-row">
    <input id="passcode-input" type="text" autocomplete="off" spellcheck="false" placeholder="ANSWER">
    <div class="cursor"></div>
  </div>
  <div id="feedback"></div>
</div>

<div id="skip-hint" onclick="restart()">restart sequence</div>

<script>
const FULL_TEXT = "You are about to enter The Peripheral Initiative — a collective of music ideologies that exists on the edge of how music is discovered, and how it is supposed to be heard.";
const GLYPHS = "アイウエオカキクケコサシスセソタチツテト01234567890!@#$%^&*<>/\\|+—_";

const decodeEl = document.getElementById('terminal'); // kept name for dissolve/fade logic below
const passLayer = document.getElementById('passcode-layer');
const rainCanvas = document.getElementById('rain-canvas');
const feedback = document.getElementById('feedback');
const input = document.getElementById('passcode-input');
let rafId = null;

const PROMPT_TEXT = "Continue into The Peripheral Initiative? (yes/no)";
const WARNING_TEXT = "Note: this experience includes rapidly changing visual patterns and flashing highlights. Viewer discretion is advised for photosensitive individuals.";

// Types a single line into the terminal, character by character, with a trailing
// blinking cursor. Calls back once finished. If keepCursor is false, the cursor
// is removed after typing (so only the newest line ever shows a live cursor).
function typeLine(text, speed, keepCursor, callback) {
  const line = document.createElement('div');
  line.className = 'terminal-line';
  decodeEl.appendChild(line);

  const cursor = document.createElement('span');
  cursor.className = 'cursor-inline';
  line.appendChild(cursor);

  let i = 0;
  const interval = setInterval(() => {
    if (i < text.length) {
      cursor.insertAdjacentText('beforebegin', text[i]);
      i++;
    } else {
      clearInterval(interval);
      if (!keepCursor) cursor.remove();
      if (callback) callback(line);
    }
  }, speed);
}

let noCount = 0;

function beginSequence() {
  decodeEl.innerHTML = '';
  decodeEl.style.transition = 'none';
  decodeEl.style.opacity = '1';
  typeLine(FULL_TEXT, 42, false, () => {
    setTimeout(() => {
      // Warning types faster and gets a longer pause after it so it genuinely registers
      // before the yes/no prompt appears — it's a safety notice, not decoration.
      typeLine(WARNING_TEXT, 28, false, () => {
        setTimeout(() => {
          typeLine(PROMPT_TEXT, 42, false, () => {
            showYesNoPrompt();
          });
        }, 2400);
      });
    }, 1400);
  });
}

function showYesNoPrompt() {
  const promptLine = document.createElement('div');
  promptLine.className = 'terminal-line';
  promptLine.innerHTML = '<span class="prompt-arrow">&gt;&nbsp;</span>';

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.id = 'yesno-input';
  inp.autocomplete = 'off';
  inp.spellcheck = false;
  promptLine.appendChild(inp);
  decodeEl.appendChild(promptLine);
  inp.focus();

  inp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = inp.value.trim().toLowerCase();
    inp.disabled = true;

    if (val === 'yes' || val === 'y') {
      noCount = 0;
      promptLine.innerHTML = '<span class="prompt-arrow">&gt;&nbsp;</span>' + (inp.value.trim() || 'yes');
      typeLine('Then let us begin.', 42, false, () => {
        setTimeout(dissolveIntoRain, 900);
      });
    } else {
      noCount++;
      promptLine.innerHTML = '<span class="prompt-arrow">&gt;&nbsp;</span>' + (inp.value.trim() || 'no');
      if (noCount >= 2) {
        // Second refusal — offer a real exit rather than looping forever.
        typeLine('Understood. Close this tab whenever you are ready.', 42, false, () => {});
      } else {
        typeLine('Then perhaps another time.', 42, false, () => {
          setTimeout(beginSequence, 3000);
        });
      }
    }
  });
}

function dissolveIntoRain() {
  // fade the terminal message out
  decodeEl.style.transition = 'opacity 1.6s ease';
  decodeEl.style.opacity = '0';
  rainCanvas.style.opacity = '1';
  startRain();
  setTimeout(() => {
    passLayer.classList.add('active');
  }, 2000);
}

// --- Matrix rain ---
const ctx = rainCanvas.getContext('2d');
let columns, drops;
const fontSize = 16;
const rainChars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+-/=<>#$%&";

// The rain uses several distinct color streams instead of a single green —
// deliberately different from the classic monochrome look, and it fits the
// "peripheral vision" concept: motion and color register at the edges before
// anything resolves into detail.
const COLUMN_PALETTE = [
  { dim: '#123a45', bright: '#3ee8ff' }, // cyan
  { dim: '#2a1245', bright: '#b06bff' }, // violet
  { dim: '#451230', bright: '#ff5fc9' }, // magenta
  { dim: '#12233f', bright: '#4c8bff' }, // azure
  { dim: '#123f34', bright: '#28e6b8' }, // teal
];
let columnColors = [];

// --- Easter egg: the answer is hidden in the rain itself ---
// A small set of characters are periodically highlighted in gold instead of green,
// held on screen slightly longer than a normal glyph. Watched in sequence, they
// spell out this week's answer. Everything else in the rain stays random noise.
const ANSWER_CHARS = "2010".split('');
let answerRevealIndex = 0;
let framesSinceLastReveal = 0;
const REVEAL_INTERVAL_FRAMES = 130;  // how often a new answer char gets planted
const HOLD_FRAMES = 30;              // how long that char stays highlighted
const LOOP_PAUSE_MS = 5000;          // pause before the reveal cycle repeats
let specialHold = [];
let frameCount = 0;

function sizeCanvas() {
  rainCanvas.width = window.innerWidth;
  rainCanvas.height = window.innerHeight;
  columns = Math.floor(rainCanvas.width / fontSize);
  drops = new Array(columns).fill(1);
  specialHold = new Array(columns).fill(null);
  columnColors = new Array(columns).fill(0).map(() => COLUMN_PALETTE[Math.floor(Math.random() * COLUMN_PALETTE.length)]);
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

function drawRain() {
  frameCount++;
  // skip every other frame to slow the overall fall speed
  if (frameCount % 2 !== 0) {
    rafId = requestAnimationFrame(drawRain);
    return;
  }

  ctx.fillStyle = 'rgba(7, 10, 8, 0.08)';
  ctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
  ctx.font = fontSize + 'px monospace';

  // periodically plant the next answer character into a random column
  framesSinceLastReveal++;
  if (framesSinceLastReveal >= REVEAL_INTERVAL_FRAMES && answerRevealIndex < ANSWER_CHARS.length) {
    let col, attempts = 0;
    do {
      col = Math.floor(Math.random() * columns);
      attempts++;
    } while (specialHold[col] && attempts < 20);
    specialHold[col] = { char: ANSWER_CHARS[answerRevealIndex], framesLeft: HOLD_FRAMES };
    answerRevealIndex++;
    framesSinceLastReveal = 0;
    if (answerRevealIndex >= ANSWER_CHARS.length) {
      setTimeout(() => { answerRevealIndex = 0; }, LOOP_PAUSE_MS);
    }
  }

  for (let i = 0; i < drops.length; i++) {
    let char, color, glow = 0;

    if (specialHold[i] && specialHold[i].framesLeft > 0) {
      char = specialHold[i].char;
      color = '#ffd76a'; // gold — reserved exclusively for the hidden answer, never used elsewhere
      glow = 10;
      specialHold[i].framesLeft--;
    } else {
      char = rainChars[Math.floor(Math.random() * rainChars.length)];
      const palette = columnColors[i] || COLUMN_PALETTE[0];
      color = Math.random() > 0.975 ? palette.bright : palette.dim;
    }

    const x = i * fontSize;
    const y = drops[i] * fontSize;

    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.fillStyle = color;
    ctx.fillText(char, x, y);
    ctx.shadowBlur = 0;

    if (y > rainCanvas.height && Math.random() > 0.975) {
      drops[i] = 0;
      specialHold[i] = null;
    }
    drops[i]++;
  }
  rafId = requestAnimationFrame(drawRain);
}

function startRain() {
  if (!rafId) drawRain();
}

// --- Passcode check ---
// The plaintext answer no longer lives anywhere in this file — only its hash does,
// so reading the source (or dev tools) doesn't hand someone the answer directly.
// verifyPasscode() is written as an async call specifically so it mirrors the shape of
// a real server request: in production, this function's body is replaced with an
// actual fetch() to a backend endpoint that holds the real answer and returns only
// true/false — the answer itself should never be sent to, or stored on, the client at all.
const ANSWER_HASH = '7d12ba56e9f8b3dc64f77c87318c4f37bc12cfbf1a37573cdf3e4fa683f20155';
// crypto.subtle (the real SHA-256 API) needs a secure context — HTTPS or localhost —
// and can be unavailable when a file is opened directly (file://). This fallback keeps
// the demo working everywhere; it is NOT cryptographically secure and exists only so
// local testing doesn't silently break. Production always runs over HTTPS, where the
// real SHA-256 path below is used.
const FALLBACK_ANSWER_HASH = '7c794d28';

function simpleHashFallback(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash + str.charCodeAt(i)) >>> 0;
  }
  return hash.toString(16);
}

async function sha256(text) {
  if (window.isSecureContext && window.crypto && window.crypto.subtle) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return { hash: Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join(''), usedFallback: false };
  }
  return { hash: simpleHashFallback(text), usedFallback: true };
}

async function verifyPasscode(guess) {
  // Simulates real network latency, standing in for the actual server round-trip.
  await new Promise(resolve => setTimeout(resolve, 300));
  const result = await sha256(guess.trim().toLowerCase());
  return result.usedFallback ? (result.hash === FALLBACK_ANSWER_HASH) : (result.hash === ANSWER_HASH);
}

input.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const guess = input.value;
    feedback.textContent = 'VERIFYING...';
    feedback.className = '';
    const isCorrect = await verifyPasscode(guess);
    if (isCorrect) {
      feedback.textContent = 'ACCESS GRANTED';
      feedback.className = 'correct';
      // Brief pause so ACCESS GRANTED registers, then navigate into the main site.
      // In production this points to the real hosted URL — for local demo, it opens
      // the main site file sitting in the same folder as this one.
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1800);
    } else {
      feedback.textContent = 'INCORRECT — TRY AGAIN';
      feedback.className = 'wrong';
      setTimeout(() => feedback.className = '', 400);
    }
  }
});

function restart() {
  decodeEl.style.transition = 'none';
  decodeEl.style.opacity = '1';
  passLayer.classList.remove('active');
  rainCanvas.style.opacity = '0';
  input.value = '';
  feedback.textContent = '';
  answerRevealIndex = 0;
  framesSinceLastReveal = 0;
  specialHold = new Array(columns).fill(null);
  beginSequence();
}

beginSequence();
</script>

</body>
</html>
