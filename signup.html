<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — The Peripheral Initiative</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070a08; --panel: #0e140f; --panel-light: #162018;
    --matrix: #2fe374; --decay: #123821; --resolved: #e2ede4;
    --muted: #6f8577; --gold: #ffd76a; --danger: #ff5c5c;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    color: var(--resolved);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #rain-canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.22;
    pointer-events: none;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 24px 16px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    margin-bottom: 24px;
    transition: color 0.15s;
  }

  .back-link:hover { color: var(--matrix); }

  .card {
    background: var(--panel);
    border: 1px solid var(--decay);
    border-radius: 14px;
    padding: 32px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .card-eyebrow {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .card-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--matrix);
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(47,227,116,0.25);
  }

  .card-body {
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .card-body em { color: var(--resolved); font-style: normal; }

  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }

  .progress-dot {
    flex: 1;
    height: 3px;
    border-radius: 999px;
    background: var(--panel-light);
    transition: background 0.3s;
  }

  .progress-dot.done { background: var(--matrix); }

  .field-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }

  .field-input {
    width: 100%;
    background: var(--panel-light);
    border: 1.5px solid var(--decay);
    border-radius: 8px;
    padding: 11px 13px;
    color: var(--resolved);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-input:focus { border-color: var(--matrix); }
  .field-input.valid { border-color: var(--matrix); }
  .field-input.invalid { border-color: var(--danger); }

  .field-msg {
    font-size: 0.65rem;
    margin: 7px 0 16px;
    min-height: 14px;
  }

  .field-msg.neutral { color: var(--muted); }
  .field-msg.valid { color: var(--matrix); }
  .field-msg.invalid { color: var(--danger); }

  .social-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .social-divider::before, .social-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--decay);
  }

  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel-light);
    border: 1px solid var(--decay);
    border-radius: 8px;
    padding: 10px;
    color: var(--resolved);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }

  .social-btn:hover { border-color: var(--muted); }

  .policy-note {
    background: var(--panel-light);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.62rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--decay);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--resolved); border-color: var(--muted); }

  .btn-primary {
    background: var(--matrix);
    color: var(--void);
    border-color: var(--matrix);
    font-weight: 700;
  }

  .btn-primary:hover { background: #b6ffd8; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .card-footer {
    text-align: center;
    margin-top: 16px;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .card-footer a { color: var(--matrix); text-decoration: none; }
  .card-footer a:hover { text-decoration: underline; }

  .success-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(47,227,116,0.12);
    border: 2px solid var(--matrix);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin: 0 auto 16px;
  }
</style>
</head>
<body>

<canvas id="rain-canvas"></canvas>

<div class="page-wrap">
  <a href="home.html" class="back-link">← Back to The Peripheral Initiative</a>

  <div class="card" id="signup-card">
    <!-- Populated by JS -->
  </div>

  <div class="card-footer" style="margin-top:14px;">
    Already have an account? <a href="login.html">Log In</a>
  </div>
</div>

<script>
let step = 1;
let chosenAlias = '';
let chosenIdentity = '';

const RESERVED_IDENTITIES = ['test@example.com','5555555555'];
const RESERVED_NAMES = ['admin','administrator','moderator','staff','official','peripheralteam','support'];

function normalize(s) {
  return s.toLowerCase()
    .replace(/1/g,'i').replace(/0/g,'o').replace(/3/g,'e')
    .replace(/4/g,'a').replace(/5/g,'s').replace(/[^a-z]/g,'');
}

function getRegistered() {
  try { return JSON.parse(localStorage.getItem('pi_registered') || '[]'); }
  catch(e) { return []; }
}

function renderStep() {
  const card = document.getElementById('signup-card');

  const logoSVG = `
    <div class="logo-row">
      <svg viewBox="0 0 38 38" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="19" r="15" fill="none" stroke="#2fe374" stroke-width="1.5" stroke-dasharray="70 24" stroke-dashoffset="6"/>
        <circle cx="19" cy="19" r="3.5" fill="#2fe374"/>
        <line x1="19" y1="1"  x2="19" y2="5"  stroke="#2fe374" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="19" y1="33" x2="19" y2="37" stroke="#2fe374" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="1"  y1="19" x2="5"  y2="19" stroke="#2fe374" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="33" y1="19" x2="37" y2="19" stroke="#2fe374" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span style="font-size:0.75rem;color:var(--muted);letter-spacing:0.1em;">THE PERIPHERAL INITIATIVE</span>
    </div>`;

  const progress = `
    <div class="progress-bar">
      <div class="progress-dot ${step >= 1 ? 'done' : ''}"></div>
      <div class="progress-dot ${step >= 2 ? 'done' : ''}"></div>
      <div class="progress-dot ${step >= 3 ? 'done' : ''}"></div>
    </div>`;

  if (step === 1) {
    card.innerHTML = `
      ${logoSVG}
      ${progress}
      <div class="card-eyebrow">Step 1 of 3</div>
      <div class="card-title">Date of Birth</div>
      <div class="card-body">The Peripheral Initiative requires users to be 18 or older.</div>
      <label class="field-label">Your birthdate</label>
      <input type="date" class="field-input" id="birthdate-input">
      <div class="field-msg neutral" id="age-msg"></div>
      <div class="btn-row">
        <a href="home.html" class="btn btn-ghost">Cancel</a>
        <button class="btn btn-primary" onclick="checkAge()">Continue</button>
      </div>`;
  }

  if (step === 1.5) {
    card.innerHTML = `
      ${logoSVG}
      <div class="card-title" style="color:var(--danger);">This platform is 18+</div>
      <div class="card-body">Based on the birthdate entered, this account doesn't meet the minimum age requirement. You must be 18 or older to create an account.</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="step=1;renderStep();">Try Again</button>
        <a href="home.html" class="btn btn-primary">Go Back</a>
      </div>`;
  }

  if (step === 2) {
    card.innerHTML = `
      ${logoSVG}
      ${progress}
      <div class="card-eyebrow">Step 2 of 3</div>
      <div class="card-title">Verify Your Identity</div>
      <div class="card-body">Link one contact method to your account — <em>one email, phone number, or social login per person.</em> This ties permanently to your username and can never be reassigned.</div>
      <button class="social-btn" onclick="socialSignup('Apple')">🍎 Continue with Apple</button>
      <button class="social-btn" onclick="socialSignup('Google')">🔵 Continue with Google</button>
      <div class="social-divider">or use email / phone</div>
      <label class="field-label">Email address or phone number</label>
      <input type="text" class="field-input" id="identity-input" placeholder="email@domain.com or +1 555 000 0000" oninput="onIdentityInput()">
      <div class="field-msg neutral" id="identity-msg">Verified once — permanently tied to your username.</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="step=1;renderStep();">Back</button>
        <button class="btn btn-primary" id="identity-continue" disabled onclick="goToUsername()">Continue</button>
      </div>`;
  }

  if (step === 3) {
    card.innerHTML = `
      ${logoSVG}
      ${progress}
      <div class="card-eyebrow">Step 3 of 3</div>
      <div class="card-title">Choose Your Alias</div>
      <div class="card-body">This is what other users see on the forum. <em>Pick something that's yours.</em></div>
      <label class="field-label">Username</label>
      <input type="text" class="field-input" id="alias-input" placeholder="e.g. VinylVortex" oninput="onAliasInput()">
      <div class="field-msg neutral" id="alias-msg">Pick something that's yours — you can change it later.</div>
      <div class="policy-note">🛡️ Offensive, hateful, racist, or impersonating usernames are never allowed — no exceptions. Checked automatically and reportable by other users after the fact.</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="step=2;renderStep();">Back</button>
        <button class="btn btn-primary" id="alias-continue" disabled onclick="finishSignup()">Create Account</button>
      </div>`;
  }

  if (step === 4) {
    card.innerHTML = `
      ${logoSVG}
      <div class="success-icon">✓</div>
      <div class="card-title" style="text-align:center;">You're in</div>
      <div class="card-body" style="text-align:center;">Welcome to The Peripheral Initiative, <em>${chosenAlias}</em>. Your account is live.</div>
      <a href="home.html" class="btn btn-primary" style="display:block;text-align:center;margin-top:8px;">Enter the Forum</a>`;
  }
}

function checkAge() {
  const inp = document.getElementById('birthdate-input');
  const msg = document.getElementById('age-msg');
  if (!inp.value) { msg.className='field-msg invalid'; msg.textContent='Please enter your birthdate.'; return; }
  const birth = new Date(inp.value);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  step = age < 18 ? 1.5 : 2;
  renderStep();
}

function socialSignup(provider) {
  // Simulates OAuth — in production, this initiates the real OAuth flow
  const fakeEmail = provider.toLowerCase() + '_user@peripheral.demo';
  chosenIdentity = fakeEmail;
  step = 3;
  renderStep();
}

function onIdentityInput() {
  const inp = document.getElementById('identity-input');
  const msg = document.getElementById('identity-msg');
  const btn = document.getElementById('identity-continue');
  const val = inp.value.trim().toLowerCase();
  const registered = getRegistered();
  if (!val) { inp.className='field-input'; msg.className='field-msg neutral'; msg.textContent='Verified once — permanently tied to your username.'; btn.disabled=true; return; }
  if (RESERVED_IDENTITIES.includes(val) || registered.find(a=>a.identity===val)) {
    inp.className='field-input invalid'; msg.className='field-msg invalid'; msg.textContent='This contact method is already linked to another account.'; btn.disabled=true; return;
  }
  inp.className='field-input valid'; msg.className='field-msg valid'; msg.textContent='Looks good — a verification code would be sent here.'; btn.disabled=false;
}

function goToUsername() {
  chosenIdentity = document.getElementById('identity-input').value.trim().toLowerCase();
  step = 3; renderStep();
}

function onAliasInput() {
  const inp = document.getElementById('alias-input');
  const msg = document.getElementById('alias-msg');
  const btn = document.getElementById('alias-continue');
  const trimmed = inp.value.trim();
  if (!trimmed) { inp.className='field-input'; msg.className='field-msg neutral'; msg.textContent="Pick something that's yours."; btn.disabled=true; return; }
  if (trimmed.length < 3) { inp.className='field-input invalid'; msg.className='field-msg invalid'; msg.textContent='Too short — at least 3 characters.'; btn.disabled=true; return; }
  const registered = getRegistered();
  if (registered.find(a => a.alias.toLowerCase() === trimmed.toLowerCase())) {
    inp.className='field-input invalid'; msg.className='field-msg invalid'; msg.textContent='That username is already taken.'; btn.disabled=true; return;
  }
  if (RESERVED_NAMES.some(n => normalize(trimmed).includes(n))) { inp.className='field-input invalid'; msg.className='field-msg invalid'; msg.textContent="That name isn't available."; btn.disabled=true; return; }
  inp.className='field-input valid'; msg.className='field-msg valid'; msg.textContent='Looks good.'; btn.disabled=false; chosenAlias=trimmed;
}

function finishSignup() {
  try {
    const registered = getRegistered();
    registered.push({ identity: chosenIdentity, alias: chosenAlias });
    localStorage.setItem('pi_registered', JSON.stringify(registered));
    localStorage.setItem('pi_verified', 'true');
    localStorage.setItem('pi_alias', chosenAlias);
    localStorage.setItem('pi_identity', chosenIdentity);
  } catch(e) {}
  step = 4; renderStep();
}

// ── Matrix rain ────────────────────────────────────────
(function() {
  const canvas = document.getElementById('rain-canvas');
  const ctx = canvas.getContext('2d');
  const CHARS = "アイウエオカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+-/<>#$%";
  const COLORS = ['#3ee8ff','#b06bff','#ff5fc9','#4c8bff','#28e6b8'];
  const FS = 14;
  let columns, drops, colColors;
  function resize() {
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    columns=Math.floor(canvas.width/FS);
    drops=Array(columns).fill(1);
    colColors=Array.from({length:columns},()=>COLORS[Math.floor(Math.random()*COLORS.length)]);
  }
  function draw() {
    ctx.fillStyle='rgba(7,10,8,0.035)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font=FS+'px JetBrains Mono,monospace';
    for(let i=0;i<columns;i++){
      ctx.fillStyle=colColors[i];
      ctx.fillText(CHARS[Math.floor(Math.random()*CHARS.length)],i*FS,drops[i]*FS);
      if(drops[i]*FS>canvas.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  }
  window.addEventListener('resize',resize); resize(); setInterval(draw,55);
})();

// ── Redirect if already logged in ─────────────────────
try {
  if (localStorage.getItem('pi_verified') === 'true') {
    window.location.href = 'home.html';
  }
} catch(e) {}

renderStep();
</script>
</body>
</html>
