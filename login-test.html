<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — The Peripheral Initiative</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070a08; --panel: #0e140f; --panel-light: #162018;
    --matrix: #2fe374; --decay: #123821; --resolved: #e2ede4;
    --muted: #6f8577; --gold: #ffd76a; --danger: #ff5c5c;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    color: var(--resolved);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #rain-canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.22;
    pointer-events: none;
  }

  .page-wrap {
    margin-top: 26px;
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 24px 16px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    margin-bottom: 24px;
    transition: color 0.15s;
  }

  .back-link:hover { color: var(--matrix); }

  .card {
    background: var(--panel);
    border: 1px solid var(--decay);
    border-radius: 14px;
    padding: 32px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .card-eyebrow {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .card-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--matrix);
    margin-bottom: 10px;
    text-shadow: 0 0 12px rgba(47,227,116,0.25);
  }

  .card-body {
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .field-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }

  .field-input {
    width: 100%;
    background: var(--panel-light);
    border: 1.5px solid var(--decay);
    border-radius: 8px;
    padding: 11px 13px;
    color: var(--resolved);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-input:focus { border-color: var(--matrix); }
  .field-input.valid { border-color: var(--matrix); }
  .field-input.invalid { border-color: var(--danger); }

  .field-msg {
    font-size: 0.65rem;
    margin: 7px 0 16px;
    min-height: 14px;
  }

  .field-msg.neutral { color: var(--muted); }
  .field-msg.valid { color: var(--matrix); }
  .field-msg.invalid { color: var(--danger); }

  .forgot-link {
    font-size: 0.65rem;
    color: var(--matrix);
    text-decoration: none;
    cursor: pointer;
    display: block;
    margin-bottom: 18px;
    margin-top: -8px;
  }

  .forgot-link:hover { text-decoration: underline; }

  .social-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .social-divider::before, .social-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--decay);
  }

  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel-light);
    border: 1px solid var(--decay);
    border-radius: 8px;
    padding: 10px;
    color: var(--resolved);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }

  .social-btn:hover { border-color: var(--muted); }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--decay);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--resolved); border-color: var(--muted); }

  .btn-primary {
    background: var(--matrix);
    color: var(--void);
    border-color: var(--matrix);
    font-weight: 700;
  }

  .btn-primary:hover { background: #b6ffd8; }

  .card-footer {
    text-align: center;
    margin-top: 16px;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .card-footer a { color: var(--matrix); text-decoration: none; }
  .card-footer a:hover { text-decoration: underline; }

  .lookup-result {
    background: var(--panel-light);
    border: 1px solid var(--matrix);
    border-radius: 8px;
    padding: 12px;
    font-size: 0.75rem;
    color: var(--matrix);
    margin-bottom: 16px;
    display: none;
  }

  /* ---- added for password auth ---- */
  .strength-track {
    height: 3px;
    background: var(--decay);
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 0;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    background: var(--danger);
    border-radius: 999px;
    transition: width 0.25s ease, background 0.25s ease;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.7rem;
    color: var(--muted);
    cursor: pointer;
    margin-top: 4px;
    user-select: none;
  }
  .checkbox-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border: 1.5px solid var(--decay);
    border-radius: 4px;
    background: var(--panel-light);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  .checkbox-row input[type="checkbox"]:checked {
    background: var(--matrix);
    border-color: var(--matrix);
  }
  .checkbox-row input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--void);
    font-size: 0.68rem;
    font-weight: 700;
  }
  .checkbox-row:hover { color: var(--resolved); }
  .stay-note {
    font-size: 0.62rem;
    color: var(--muted);
    margin: 7px 0 4px;
    line-height: 1.5;
    opacity: 0.85;
  }
</style>

<body>

<div style="position:fixed;top:0;left:0;right:0;z-index:999;background:#ffd76a;color:#070a08;
     font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.08em;
     text-align:center;padding:6px 10px;">
  TEST PAGE &mdash; not the live sign-up. Safe to delete.
</div>
<canvas id="rain-canvas"></canvas>

<div class="page-wrap">
  <a href="home-test.html" class="back-link">← Back to The Peripheral Initiative</a>

  <div class="card" id="main-card">
    <!-- Rendered by renderSignInStep(). The placeholder below is what
         shows for the fraction of a second before JS runs, and what
         stays if JS never loads at all. Deliberately not a fake form:
         a form that cannot submit is worse than an honest message. -->
    <div class="logo-row">
      <img src="pi-logo.png" width="28" height="28" alt="The Peripheral Initiative" style="display:block;flex-shrink:0;" />
      <span style="font-size:0.75rem;color:var(--muted);letter-spacing:0.1em;">THE PERIPHERAL INITIATIVE</span>
    </div>
    <div class="card-eyebrow">Welcome Back</div>
    <div class="card-title">Log In</div>
    <div class="card-body" id="boot-msg">Connecting&hellip;</div>
    <noscript>
      <div class="field-msg invalid" style="margin-top:4px;">
        This page needs JavaScript to sign you in. Please enable it and reload.
      </div>
    </noscript>
  </div>

  <div class="card-footer" style="margin-top:14px;">
    No account yet? <a href="signup-test.html">Sign Up to Contribute</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
/* ============================================================
   LOG IN — password + stay-signed-in + password reset
   ------------------------------------------------------------
   Three modes live in this one page:

     signin    email + password + keep-me-signed-in
     forgot    request a reset link
     reset     set a new password (arrived via that link)

   The reset mode is entered automatically. Supabase puts a recovery
   token in the URL fragment when someone clicks the emailed link;
   detectSessionInUrl (set in supabase-config.js) picks it up and
   establishes a temporary session that is allowed to change the
   password and nothing else.

   The prototype's "Forgot your username?" lookup is gone, and that
   is a security fix rather than a lost feature. It used to accept
   any email and print the username attached to it — meaning anyone
   could type a stranger's address and learn their forum identity.
   The username now appears only after a real sign-in.
   ============================================================ */

let loginEmail = '';


function setMsg(id, cls, text) {
  const el = document.getElementById(id);
  if (el) { el.className = 'field-msg ' + cls; el.textContent = text; }
}

function setField(id, cls) {
  const el = document.getElementById(id);
  if (el) el.className = 'field-input' + (cls ? ' ' + cls : '');
}

function logoRow() {
  return `
    <div class="logo-row">
      <img src="pi-logo.png" width="28" height="28" alt="The Peripheral Initiative" style="display:block;flex-shrink:0;" />
      <span style="font-size:0.75rem;color:var(--muted);letter-spacing:0.1em;">THE PERIPHERAL INITIATIVE</span>
    </div>`;
}


/* ------------------------------------------------------------
   BOOT

   Order matters. Check for a recovery link BEFORE checking for an
   existing session — otherwise someone already signed in who clicks
   a reset link gets bounced home and can never change their
   password.
   ------------------------------------------------------------ */
let recoveryHandled = false;

/* The reliable way to detect a password-reset arrival, because it
   works the same under PKCE and the implicit flow. Under PKCE the
   link carries ?code=..., under implicit it carries #access_token=...
   — sniffing the URL means handling both and getting it wrong when
   Supabase changes defaults. This event fires either way. */
if (typeof sb !== 'undefined' && sb) sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY' && !recoveryHandled) {
    recoveryHandled = true;
    renderResetStep();
  }
});


/* ------------------------------------------------------------
   Throw-proof startup check.

   `typeof x` normally cannot throw — except on a let/const that
   exists but has not been initialised yet, which is precisely the
   case when supabase-config.js loaded and then failed partway.
   Hence the try/catch: this function must NEVER be the thing that
   breaks, because its whole job is to explain what broke.
   ------------------------------------------------------------ */
function configProblem() {
  try {
    if (typeof PERIPHERAL_CONFIG_LOADED === 'undefined') {
      return 'CONFIG_MISSING';
    }
  } catch (e) {
    return 'CONFIG_MISSING';
  }
  try {
    if (sb === null) return 'CLIENT_FAILED';
  } catch (e) {
    return 'CONFIG_MISSING';
  }
  return null;
}

function configErrorHTML(logo) {
  const problem = configProblem();

  if (problem === 'CONFIG_MISSING') {
    console.error(
      '[Peripheral] supabase-config.js did not load.\n' +
      'Check that:\n' +
      '  1. supabase-config.js sits in the SAME folder as this page\n' +
      '  2. it was pushed to GitHub alongside signup.html and login.html\n' +
      '  3. the filename matches exactly (lowercase, with the .js)\n' +
      'Open the Network tab and look for a 404 on supabase-config.js.'
    );
    return `
      ${logo}
      <div class="card-title" style="color:var(--danger);">Configuration missing</div>
      <div class="card-body">This page could not load <strong style="color:var(--resolved);">supabase-config.js</strong>.
      It has to sit in the same folder as this file and be uploaded with it.</div>
      <div class="card-body" style="font-size:.68rem;">Open the browser console for details.</div>
      <a href="home-test.html" class="btn btn-ghost" style="display:block;text-align:center;">Back</a>`;
  }

  if (problem === 'CLIENT_FAILED') {
    let detail = 'Could not connect to the database.';
    try { if (SUPABASE_CONFIG_ERROR) detail = SUPABASE_CONFIG_ERROR; } catch (e) {}
    return `
      ${logo}
      <div class="card-title" style="color:var(--danger);">Not available right now</div>
      <div class="card-body">${detail}</div>
      <div class="card-body" style="font-size:.68rem;">Open the browser console for details.</div>
      <a href="home-test.html" class="btn btn-ghost" style="display:block;text-align:center;">Back</a>`;
  }

  return null;
}

async function boot() {
  const configHTML = configErrorHTML(logoRow());
  if (configHTML) {
    document.getElementById('main-card').innerHTML = configHTML;
    return;
  }

  const hash   = window.location.hash   || '';
  const search = window.location.search || '';

  // Fallback URL sniffing, in case the event fired before this
  // script attached its listener.
  if (hash.includes('type=recovery') || search.includes('type=recovery')) {
    recoveryHandled = true;
    renderResetStep();
    return;
  }

  if (hash.includes('error_description') || search.includes('error_description')) {
    renderSignInStep();
    setMsg('login-msg','invalid','That reset link has expired. Request a new one.');
    return;
  }

  // Give the recovery event a moment to arrive before deciding this
  // is an ordinary visit.
  await new Promise(r => setTimeout(r, 120));
  if (recoveryHandled) return;

  try {
    const user = await currentUser();
    if (user) {
      const profile = await currentProfile();
      window.location.href = profile ? 'home-test.html' : 'signup-test.html';
      return;
    }
  } catch (e) {
    console.error('Startup check failed:', e);
  }

  renderSignInStep();
}


/* ---------------- sign in ---------------- */
function renderSignInStep() {
  const card = document.getElementById('main-card');
  const checked = staySignedIn() ? 'checked' : '';

  card.innerHTML = `
    ${logoRow()}
    <div class="card-eyebrow">Welcome Back</div>
    <div class="card-title">Log In</div>
    <div class="card-body">Enter the email and password tied to your account.</div>

    ${OAUTH_ENABLED ? `
      <button class="social-btn" onclick="socialLogin('apple')">🍎 Continue with Apple</button>
      <button class="social-btn" onclick="socialLogin('google')">🔵 Continue with Google</button>
      <div class="social-divider">or use email</div>
    ` : ''}

    <label class="field-label">Email address</label>
    <input type="email" class="field-input" id="login-input" placeholder="email@domain.com"
           autocomplete="email" oninput="onLoginInput()"
           onkeydown="if(event.key==='Enter')document.getElementById('password-input').focus()">
    <div class="field-msg neutral" id="login-msg"></div>

    <label class="field-label">Password</label>
    <input type="password" class="field-input" id="password-input"
           autocomplete="current-password" oninput="onLoginInput()"
           onkeydown="if(event.key==='Enter')submitLogin()">
    <div class="field-msg neutral" id="password-msg"></div>

    <label class="checkbox-row">
      <input type="checkbox" id="stay-signed-in" ${checked} onchange="onStayToggle()">
      <span>Keep me signed in</span>
    </label>
    <div class="stay-note" id="stay-note">${staySignedIn()
      ? 'You will stay signed in on this device until you sign out.'
      : 'You will be signed out when you close the browser.'}</div>

    <span class="forgot-link" onclick="renderForgotStep()">Forgot your password?</span>

    <div class="btn-row">
      <a href="home-test.html" class="btn btn-ghost">Cancel</a>
      <button class="btn btn-primary" id="login-btn" disabled onclick="submitLogin()">Log In</button>
    </div>`;
}


/* ------------------------------------------------------------
   The preference is written BEFORE sign-in, on purpose. The storage
   adapter reads it at the moment the session is saved, so it has to
   already be correct by then.
   ------------------------------------------------------------ */
function onStayToggle() {
  const on = document.getElementById('stay-signed-in').checked;
  setStaySignedIn(on);
  const note = document.getElementById('stay-note');
  if (note) {
    note.textContent = on
      ? 'You will stay signed in on this device until you sign out.'
      : 'You will be signed out when you close the browser.';
  }
}


function onLoginInput() {
  const email = document.getElementById('login-input').value.trim();
  const pw    = document.getElementById('password-input').value;
  const btn   = document.getElementById('login-btn');

  if (email && !looksLikeEmail(email)) {
    setField('login-input','invalid');
    setMsg('login-msg','invalid',"That doesn't look like a valid email address.");
    btn.disabled = true;
    return;
  }

  setField('login-input', email ? 'valid' : '');
  setMsg('login-msg','neutral','');
  setMsg('password-msg','neutral','');
  setField('password-input','');
  btn.disabled = !(looksLikeEmail(email) && pw.length > 0);
}


async function socialLogin(provider) {
  try {
    const { error } = await sb.auth.signInWithOAuth({
      provider,
      options: { redirectTo: window.location.origin + '/login-test.html' }
    });
    if (error) throw error;
  } catch (e) {
    setMsg('login-msg','invalid',
      provider + ' sign-in is not configured yet. Use email for now.');
  }
}


async function submitLogin() {
  const btn = document.getElementById('login-btn');
  if (btn.disabled) return;

  const email = document.getElementById('login-input').value.trim().toLowerCase();
  const pw    = document.getElementById('password-input').value;

  // Belt and braces — make sure the adapter sees the current choice.
  const box = document.getElementById('stay-signed-in');
  if (box) setStaySignedIn(box.checked);

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;

    const profile = await currentProfile();

    if (!profile) {
      // Confirmed, but never finished picking a username.
      window.location.href = 'signup-test.html';
      return;
    }

    if (profile.is_banned) {
      renderSuspended();
      return;
    }

    clearLegacyLocalStorage();
    window.location.href = 'home-test.html';
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Log In';

    const m = (e?.message || '').toLowerCase();
    if (m.includes('email not confirmed')) {
      loginEmail = email;
      setMsg('password-msg','invalid','This email is not confirmed yet.');
      const note = document.getElementById('stay-note');
      if (note) {
        note.innerHTML = `<a href="#" onclick="resendConfirmation();return false;" style="color:var(--matrix);">Resend the confirmation code</a>`;
      }
      return;
    }

    setField('password-input','invalid');
    setMsg('password-msg','invalid', friendlyAuthError(e));
  }
}


async function resendConfirmation() {
  try {
    const { error } = await sb.auth.resend({ type: 'signup', email: loginEmail });
    if (error) throw error;
    setMsg('password-msg','valid','Confirmation code sent — finish signing up.');
    setTimeout(() => { window.location.href = 'signup-test.html'; }, 1500);
  } catch (e) {
    setMsg('password-msg','invalid', friendlyAuthError(e));
  }
}


/* ---------------- suspended ---------------- */
function renderSuspended() {
  // The Community Guidelines promise a suspended account can sign in
  // far enough to read the decision and appeal it. That screen does
  // not exist yet — until it does, say so plainly instead of failing
  // silently.
  document.getElementById('main-card').innerHTML = `
    ${logoRow()}
    <div class="card-title" style="color:var(--danger);">Account suspended</div>
    <div class="card-body">This account has been suspended. To appeal, contact
    <span style="color:var(--resolved);">lachlan@theperipheralinitiative.com</span> —
    a different moderator than the one who made the original decision will review it.</div>
    <a href="home-test.html" class="btn btn-ghost" style="display:block;text-align:center;">Back</a>`;
  sb.auth.signOut();
}


/* ---------------- forgot password ---------------- */
function renderForgotStep() {
  const card = document.getElementById('main-card');
  card.innerHTML = `
    ${logoRow()}
    <div class="card-eyebrow">Password Reset</div>
    <div class="card-title">Forgot Password</div>
    <div class="card-body">Enter your email address and we'll send a link to set a new password.</div>

    <label class="field-label">Email address</label>
    <input type="email" class="field-input" id="forgot-input" placeholder="email@domain.com"
           autocomplete="email" oninput="onForgotInput()"
           onkeydown="if(event.key==='Enter')sendReset()">
    <div class="field-msg neutral" id="forgot-msg"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="renderSignInStep()">Back</button>
      <button class="btn btn-primary" id="forgot-btn" disabled onclick="sendReset()">Send Link</button>
    </div>`;
}


function onForgotInput() {
  const val = document.getElementById('forgot-input').value.trim();
  document.getElementById('forgot-btn').disabled = !looksLikeEmail(val);
  setField('forgot-input', val ? (looksLikeEmail(val) ? 'valid' : 'invalid') : '');
  setMsg('forgot-msg','neutral','');
}


/* ------------------------------------------------------------
   Note the confirmation message is identical whether or not the
   address has an account. Saying "no account found" here would let
   anyone test which emails are registered.
   ------------------------------------------------------------ */
async function sendReset() {
  const btn = document.getElementById('forgot-btn');
  if (btn.disabled) return;

  const email = document.getElementById('forgot-input').value.trim().toLowerCase();
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login-test.html'
    });
    if (error) throw error;
  } catch (e) {
    console.error('Reset request failed:', e);
  }

  document.getElementById('main-card').innerHTML = `
    ${logoRow()}
    <div class="card-eyebrow">Password Reset</div>
    <div class="card-title">Check Your Email</div>
    <div class="card-body">If an account exists for <span style="color:var(--resolved);">${email}</span>,
    a reset link is on its way. The link expires shortly — use it soon.</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="renderSignInStep()">Back to Log In</button>
    </div>`;
}


/* ---------------- set new password ---------------- */
function renderResetStep() {
  const card = document.getElementById('main-card');
  card.innerHTML = `
    ${logoRow()}
    <div class="card-eyebrow">Password Reset</div>
    <div class="card-title">Set a New Password</div>
    <div class="card-body">At least ${MIN_PASSWORD_LENGTH} characters, with an uppercase letter, a lowercase letter, a number, and a symbol.</div>

    <label class="field-label">New password</label>
    <input type="password" class="field-input" id="new-password"
           autocomplete="new-password" oninput="onResetInput()">
    <div class="strength-track"><div class="strength-fill" id="strength-fill"></div></div>
    <div class="field-msg neutral" id="new-msg">Choose something you'll remember.</div>

    <label class="field-label">Confirm new password</label>
    <input type="password" class="field-input" id="new-confirm"
           autocomplete="new-password" oninput="onResetInput()"
           onkeydown="if(event.key==='Enter')submitNewPassword()">
    <div class="field-msg neutral" id="new-confirm-msg"></div>

    <label class="checkbox-row">
      <input type="checkbox" id="show-password" onchange="toggleResetVisible()">
      <span>Show passwords</span>
    </label>

    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-primary" id="reset-btn" disabled onclick="submitNewPassword()"
              style="flex:1;">Update Password</button>
    </div>`;
}


function toggleResetVisible() {
  const on = document.getElementById('show-password').checked;
  ['new-password','new-confirm'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.type = on ? 'text' : 'password';
  });
}


function onResetInput() {
  const pw      = document.getElementById('new-password').value;
  const confirm = document.getElementById('new-confirm').value;
  const btn     = document.getElementById('reset-btn');
  const fill    = document.getElementById('strength-fill');

  const score = passwordStrength(pw);
  if (fill) {
    fill.style.width      = (score * 25) + '%';
    fill.style.background = STRENGTH_COLOR[score];
  }

  const problem = passwordProblem(pw);
  if (problem) {
    setField('new-password', pw ? 'invalid' : '');
    setMsg('new-msg', pw ? 'invalid' : 'neutral', pw ? problem : "Choose something you'll remember.");
    btn.disabled = true;
    return;
  }

  setField('new-password','valid');
  setMsg('new-msg','valid', STRENGTH_LABEL[score] + ' password.');

  if (confirm !== pw) {
    setField('new-confirm', confirm ? 'invalid' : '');
    setMsg('new-confirm-msg', confirm ? 'invalid' : 'neutral',
           confirm ? 'Passwords do not match.' : 'Type it once more.');
    btn.disabled = true;
    return;
  }

  setField('new-confirm','valid');
  setMsg('new-confirm-msg','valid','Passwords match.');
  btn.disabled = false;
}


async function submitNewPassword() {
  const btn = document.getElementById('reset-btn');
  if (btn.disabled) return;

  const pw = document.getElementById('new-password').value;
  btn.disabled = true;
  btn.textContent = 'Updating…';

  try {
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;

    // Clear the recovery token out of the address bar so a stale
    // link cannot be reused from browser history.
    history.replaceState(null, '', window.location.pathname);

    document.getElementById('main-card').innerHTML = `
      ${logoRow()}
      <div class="card-title" style="color:var(--matrix);">Password updated</div>
      <div class="card-body">You're signed in with your new password.</div>
      <a href="home-test.html" class="btn btn-primary" style="display:block;text-align:center;">Continue</a>`;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Update Password';
    setMsg('new-confirm-msg','invalid', friendlyAuthError(e));
  }
}

// ── Matrix rain ────────────────────────────────────────
(function() {
  const canvas = document.getElementById('rain-canvas');
  const ctx = canvas.getContext('2d');
  const CHARS = "アイウエオカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+-/<>#$%";
  const COLORS = ['#3ee8ff','#b06bff','#ff5fc9','#4c8bff','#28e6b8'];
  const FS = 14;
  let columns, drops, colColors;
  function resize() {
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    columns=Math.floor(canvas.width/FS);
    drops=Array(columns).fill(1);
    colColors=Array.from({length:columns},()=>COLORS[Math.floor(Math.random()*COLORS.length)]);
  }
  function draw() {
    ctx.fillStyle='rgba(7,10,8,0.035)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font=FS+'px JetBrains Mono,monospace';
    for(let i=0;i<columns;i++){
      ctx.fillStyle=colColors[i];
      ctx.fillText(CHARS[Math.floor(Math.random()*CHARS.length)],i*FS,drops[i]*FS);
      if(drops[i]*FS>canvas.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  }
  window.addEventListener('resize',resize); resize(); setInterval(draw,55);
})();

boot();
